name: Publish to NuGet

# Runs when the maintainer pushes a version tag, e.g.:
#   git tag v10.0.15 && git push origin v10.0.15
# The tag must match <Version> in EFMaterializedPath/EFMaterializedPath.csproj.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional: add required reviewers to the "nuget" environment in the repo settings
    # to get a manual approval step before anything is pushed to nuget.org.
    environment: nuget
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing (OIDC)

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Check tag matches package version
      run: |
        version=$(dotnet msbuild EFMaterializedPath/EFMaterializedPath.csproj -getProperty:Version)
        tag="${GITHUB_REF_NAME#v}"
        echo "csproj Version: $version, tag: $tag"
        if [ "$version" != "$tag" ]; then
          echo "::error::Tag v$tag does not match <Version>$version</Version> in the csproj"
          exit 1
        fi

    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -c Release
    - name: Test (InMemory, SQLite, PostgreSQL, SQL Server)
      run: dotnet test --no-build -c Release --verbosity normal

    - name: Pack
      run: dotnet pack EFMaterializedPath --no-build -c Release -o artifacts

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: nupkg
        path: artifacts/*.nupkg

    - name: NuGet login (trusted publishing)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to nuget.org
      run: >
        dotnet nuget push "artifacts/*.nupkg"
        --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate
